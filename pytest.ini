# pytest.ini

[pytest]
# SYNTAXE : testpaths = dossier
# EXPLICATION : Où chercher les tests
testpaths = tests

# SYNTAXE : python_files = pattern
# EXPLICATION : Quels fichiers sont des tests
python_files = test_*.py

# SYNTAXE : python_classes = pattern
# EXPLICATION : Quelles classes sont des tests
python_classes = Test*

# SYNTAXE : python_functions = pattern
# EXPLICATION : Quelles fonctions sont des tests
python_functions = test_*

# SYNTAXE : asyncio_mode = mode
# EXPLICATION : Mode pour les tests async
asyncio_mode = auto

# Options d'affichage
addopts = 
    -v                    
    -s                    
    --tb=short            
    --strict-markers      
    --disable-warnings    